{% extends "base.html" %}

{% block content %}
<div class="board-container">
    <div class="board-header" style="display: flex; justify-content: space-between; align-items: flex-end;">
        <h2 id="postTitle">로딩 중...</h2>
        <button onclick="history.back()" class="btn-write" style="background-color: #666;">목록으로</button>
    </div>
    
    <div style="display: flex; margin-bottom: 20px; color: #666; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
            작성자: <span id="postOwner"></span> | 작성일: <span id="postDate"></span> | 카테고리: <span id="postCategory"></span>
        <div>
            <button onclick="goToEdit()" class="btn-write" style="background-color: #666;">수정</button>
            <button onclick="history.back()" class="btn-write" style="background-color: #666;">삭제</button>
        </div>
    </div>

    <div id="postContent" style="line-height: 1.6; min-height: 300px; white-space: pre-wrap;">
        내용을 불러오고 있습니다...
    </div>
</div>

<script src="{{ url_for('static', path='/js/ecnm/ecnm_info/post_detail.js') }}"></script>
{% endblock %}
