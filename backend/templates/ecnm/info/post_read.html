{% extends "base.html" %}

{% block content %}
<div class="board-container">
    <div class="board-header" style="margin-bottom: 15px;">
        <h2 id="postTitle">로딩 중...</h2>
    </div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #666; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        
        <div>
            작성자: <span id="postOwner"></span> | 작성일: <span id="postDate"></span> | 카테고리: <span id="postCategory"></span>
        </div>
        
        <div style="display: flex; gap: 4px;">
            <button onclick="location.href='/ecnm/info'" class="btn-list" style="background-color: #666; margin: 0; padding: 4px 6px;">목록</button>
            <button onclick="goToUpdate()" class="btn-upd" style="background-color: #666; margin: 0; padding: 4px 6px;">수정</button>
            <button onclick="deletePost()" class="btn-del" style="background-color: #666; margin: 0; padding: 4px 6px;">삭제</button>
        </div>
        
    </div>

    <div id="postContent" style="line-height: 1.6; min-height: 300px; white-space: pre-wrap;">
        내용을 불러오고 있습니다...
    </div>
</div>

<script src="{{ url_for('static', path='/js/ecnm/ecnm_info/post_detail.js') }}"></script>
{% endblock %}
